<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Sessão Reballan</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, "Times New Roman", serif;
        background:
            radial-gradient(circle at top, #3a2a1e 0%, #17120f 42%, #080706 100%);
        color: #f7ead5;
        overflow: hidden;
    }

    .film-strip {
        position: fixed;
        inset: 0;
        opacity: .07;
        pointer-events: none;
        background-image:
            repeating-linear-gradient(
                90deg,
                transparent 0 58px,
                #fff 58px 72px,
                transparent 72px 130px
            );
    }

    .container {
        width: min(680px, 92vw);
        text-align: center;
        padding: 48px 32px;
        border: 1px solid rgba(244, 205, 142, .25);
        border-radius: 24px;
        background: rgba(18, 14, 11, .82);
        box-shadow: 0 30px 80px rgba(0,0,0,.55);
        backdrop-filter: blur(8px);
        position: relative;
    }

    .clapper {
        font-size: 42px;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-size: clamp(30px, 6vw, 52px);
        letter-spacing: -1px;
    }

    .subtitle {
        margin: 12px auto 34px;
        color: #cbbba5;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    .movie-card {
        min-height: 205px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
        border-radius: 18px;
        background: linear-gradient(145deg, #241b15, #120e0b);
        border: 1px solid rgba(244, 205, 142, .18);
        margin-bottom: 26px;
    }

    .label {
        font-family: Arial, sans-serif;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 11px;
        color: #b99a6c;
        margin-bottom: 15px;
    }

    #movie {
        font-size: clamp(24px, 5vw, 38px);
        line-height: 1.12;
        margin: 0;
        color: #ffe8bc;
    }

    #director {
        margin: 14px 0 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
        color: #bdb0a0;
    }

    button {
        border: 0;
        border-radius: 999px;
        padding: 17px 34px;
        background: #d5a85f;
        color: #17100a;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(213,168,95,.2);
        transition: transform .15s, filter .15s;
    }

    button:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
    }

    button:active {
        transform: translateY(1px) scale(.98);
    }

    button:disabled {
        cursor: wait;
        opacity: .7;
    }

    .spinning #movie {
        animation: flicker .12s infinite alternate;
    }

    @keyframes flicker {
        from { opacity: .35; transform: translateY(-2px); }
        to { opacity: 1; transform: translateY(2px); }
    }

    .counter {
        margin-top: 20px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        color: #74695e;
    }
</style>
</head>
<body>
<div class="film-strip"></div>

<main class="container">
    <div class="clapper">🎬</div>
    <h1>Sessão Reballan</h1>
    <p class="subtitle">Não sabe o que assistir? Deixe o acaso escolher.</p>

    <section class="movie-card" id="card">
        <div class="label">Seu filme da noite</div>
        <h2 id="movie">Clique no botão</h2>
        <p id="director">e descubra o que assistir hoje</p>
    </section>

    <button id="sortear">🎲 Sortear filme</button>
    <div class="counter">38 filmes na lista</div>
</main>

<script>
const filmes = [
    ["A felicidade não se compra", "Frank Capra"],
    ["A pé ele não vai longe", "Gus Van Sant"],
    ["A primeira noite de um homem", "Mike Nichols"],
    ["A turba", "King Vidor"],
    ["Adorável vagabundo", "Frank Capra"],
    ["Anomalisa", "Charlie Kaufman e Duke Johnson"],
    ["As duas faces da felicidade", "Agnès Varda"],
    ["As faces de Toni Erdmann", "Maren Ade"],
    ["Assunto de família", "Hirokazu Koreeda"],
    ["Bonequinha de luxo", "Blake Edwards"],
    ["Cafarnaum", "Nadine Labaki"],
    ["Casablanca", "Michael Curtiz"],
    ["Cidadão Kane", "Orson Welles"],
    ["Cinturão vermelho", "David Mamet"],
    ["Cleo das 5 às 7", "Agnès Varda"],
    ["Correndo com tesouras", "Ryan Murphy"],
    ["Crepúsculo dos deuses", "Billy Wilder"],
    ["Dá pra fazer (Si può fare)", "Giulio Manfredonia"],
    ["Diálogos com J. Krishnamurti", ""],
    ["Doutor Jivago", "David Lean"],
    ["Felicidade", "Todd Solondz"],
    ["Frantz", "François Ozon"],
    ["Hiroshima, meu amor", "Alain Resnais"],
    ["Histórias proibidas", "Todd Solondz"],
    ["Imagem e palavra", "Jean-Luc Godard"],
    ["Kramer vs. Kramer", "Robert Benton"],
    ["Luzes da cidade", "Charles Chaplin"],
    ["Minha noite com ela", "Éric Rohmer"],
    ["Mister Lonely", "Harmony Korine"],
    ["No coração da escuridão", "Paul Schrader"],
    ["O beijo no asfalto", "Murilo Benício"],
    ["O incrível homem que encolheu", "Jack Arnold"],
    ["Onda nova", "José Antonio Garcia e Ícaro C. Martins"],
    ["Roda gigante", "Woody Allen"],
    ["Perdidos na noite", "John Schlesinger"],
    ["Zelig", "Woody Allen"]
];

const movie = document.getElementById("movie");
const director = document.getElementById("director");
const button = document.getElementById("sortear");
const card = document.getElementById("card");

button.addEventListener("click", () => {
    button.disabled = true;
    card.classList.add("spinning");

    let ticks = 0;
    const totalTicks = 16;

    const interval = setInterval(() => {
        const random = filmes[Math.floor(Math.random() * filmes.length)];
        movie.textContent = random[0];
        director.textContent = random[1] ? "Direção: " + random[1] : "Direção não informada";
        ticks++;

        if (ticks >= totalTicks) {
            clearInterval(interval);

            // Sorteio final
            const escolhido = filmes[Math.floor(Math.random() * filmes.length)];
            movie.textContent = escolhido[0];
            director.textContent = escolhido[1]
                ? "Direção: " + escolhido[1]
                : "Direção não informada";

            card.classList.remove("spinning");
            button.disabled = false;
        }
    }, 90);
});
</script>
</body>
</html>
